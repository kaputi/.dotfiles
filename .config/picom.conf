# Shadow
shadow = false;
# no-dnd-shadow = true;
#no-dock-shadow = true;
detect-rounded-corners = true;
shadow-radius = 5;
shadow-offset-x = 1;
shadow-offset-y = 1;
shadow-opacity = .3;
shadow-ignore-shaped = false;
shadow-exclude = [
	# "name = 'Notification'",
# workaround for conky until it provides window properties:
	"override_redirect = 1 && !WM_CLASS@",
    "class_g ?= 'Dmenu'",
#	"class_g ?= 'Dunst'",
# disable shadows for hidden windows:
	"_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
	"_GTK_FRAME_EXTENTS@",
# disables shadows on sticky windows:
"_NET_WM_STATE@ *= '_NET_WM_STATE_STICKY'",
];

# shadow-exclude-reg = "x10+0+0";
# xinerama-shadow-crop = true;

# menu-opacity = 0.8;
# inactive-opacity = 0.60;
inactive-opacity = 1;
# active-opacity = 0.93;
active-opacity = 1;
inactive-dim = 0.15;
#blur-background = false;
blur-kern = "3x3box";

# opacity-rule = [ "100:class_g = 'Google-chrome' && focused", "100:class_g = 'URxvt'", "100:class_g = 'vlc'" ]
opacity-rule = [
  # "100:class_g = 'Google-chrome'",
  "60:class_g = 'Urn-gtk'",
  # "100:class_g = 'firefox'",
  "90:class_g = 'Termite'",
  "90:class_g = 'Alacritty'",
  "90:class_g = 'org.wezfurlong.wezterm'",
  "90:class_g = 'Alacritty'",
  # "100:class_g = 'vlc'",
  # "100:class_g = 'Brave-browser'",
  # "100:class_g = 'Steam'",
# opacity for tabbed windows
  "95:class_g = 'Termite' && !_NET_WM_STATE@",
  "0:_NET_WM_STATE@[0] *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[1] *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[2] *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[3] *= '_NET_WM_STATE_HIDDEN'",
  "0:_NET_WM_STATE@[4] *= '_NET_WM_STATE_HIDDEN'"
  ]
fading = false;
fade-delta = 1;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [ ];

# backend = "xr_glx_hybrid";
backend = "glx";
# backend = "xrender";
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
unredir-if-possible = true;
# refresh-rate = 0;
vsync = true;
dbe = false;
#paint-on-overlay = true;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];
glx-copy-from-front = false;
use-damage =  true

#opacity-rule = [
#"99:name *?= 'Call'",
#"99:class_g = 'Chromium'",
#"99:name *?= 'Conky'",
#"99:class_g = 'Darktable'",
#"50:class_g = 'Dmenu'",
#"99:name *?= 'Event'",
#"99:class_g = 'Firefox'",
#"99:class_g = 'GIMP'",
#"99:name *?= 'Image'",
#"99:class_g = 'Lazpaint'",
#"99:class_g = 'Midori'",
#"99:name *?= 'Minitube'",
#"99:class_g = 'Mousepad'",
#"99:name *?= 'MuseScore'",
#"90:name *?= 'Page Info'",
#"99:name *?= 'Pale Moon'",
#"90:name *?= 'Panel'",
#"99:class_g = 'Pinta'",
#"90:name *?= 'Restart'",
#"99:name *?= 'sudo'",
#"99:name *?= 'Screenshot'",
#"99:class_g = 'Viewnior'",
#"99:class_g = 'VirtualBox'",
#"99:name *?= 'VLC'",
#"99:name *?= 'Write'",
#"93:class_g = 'URxvt' && !_NET_WM_STATE@",
#"0:_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
#"96:_NET_WM_STATE@ *= '_NET_WM_STATE_STICKY'"
#];

wintypes :
{
  tooltip :
  {
    fade = true;
    shadow = false;
    opacity = 0.85;
    focus = true;
  };
  fullscreen :
  {
    fade = true;
    shadow = false;
    opacity = 1;
    focus = true;
  };
  popup_menu :
  {
    fade = true;
    shadow = false;
    opacity = 0.8;
    focus = true;
  };
  dropdown_menu :
  {
    fade = true;
    shadow = false;
    opacity = 0.8;
    focus = true;
  };
};
